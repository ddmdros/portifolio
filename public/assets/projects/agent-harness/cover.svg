<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e1b4b"/>
    </linearGradient>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/>
  <g transform="translate(0,80)">
  <text x="80" y="110" fill="#e2e8f0" font-size="54" font-weight="700">agent-harness</text>
  <text x="80" y="160" fill="#94a3b8" font-size="26">hooks · write-zone map · decision queue · token cost</text>
  <g font-size="24" fill="#e2e8f0">
    <rect x="80" y="260" width="250" height="90" rx="14" fill="#1e293b" stroke="#475569" stroke-width="2"/>
    <text x="205" y="313" text-anchor="middle">agent tool call</text>
    <rect x="420" y="260" width="250" height="90" rx="14" fill="#1e293b" stroke="#818cf8" stroke-width="2"/>
    <text x="545" y="313" text-anchor="middle">pre_tool_use.py</text>
    <rect x="760" y="200" width="200" height="74" rx="14" fill="#1e293b" stroke="#475569" stroke-width="2"/>
    <text x="860" y="245" text-anchor="middle">tree_guard</text>
    <rect x="760" y="336" width="200" height="74" rx="14" fill="#1e293b" stroke="#475569" stroke-width="2"/>
    <text x="860" y="381" text-anchor="middle">git_guard</text>
    <rect x="1040" y="260" width="160" height="90" rx="14" fill="#1e293b" stroke="#34d399" stroke-width="2"/>
    <text x="1120" y="300" text-anchor="middle" font-size="20">allow</text>
    <text x="1120" y="326" text-anchor="middle" font-size="20" fill="#fca5a5">ask / deny</text>
  </g>
  <g stroke="#94a3b8" stroke-width="3" fill="none" marker-end="url(#a)">
    <path d="M330 305H415"/>
    <path d="M670 290L755 240"/>
    <path d="M670 320L755 370"/>
    <path d="M960 240L1035 290"/>
    <path d="M960 370L1035 320"/>
  </g>
  <g font-size="22" fill="#cbd5e1">
    <rect x="80" y="480" width="1120" height="150" rx="14" fill="#0b1220" stroke="#334155" stroke-width="2"/>
    <text x="110" y="525"><tspan fill="#818cf8">[[zone]]</tspan> path = "projects/*/references/**"   mode = <tspan fill="#fca5a5">"blocked"</tspan></text>
    <text x="110" y="565"><tspan fill="#818cf8">[[zone]]</tspan> path = "projects/*/jobs/*/wip/runs/**"  mode = <tspan fill="#fde68a">"append"</tspan></text>
    <text x="110" y="605"><tspan fill="#818cf8">[[zone]]</tspan> path = "projects/*/references/glossary.csv"  mode = <tspan fill="#fde68a">"ask"</tspan></text>
  </g>
</g>
</svg>
